services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sprint1_local_password
      POSTGRES_DB: ban_ve_su_kien_sprint1
    ports:
      - "5433:5432"
    volumes:
      - sprint1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ban_ve_su_kien_sprint1"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "8090:8090"
    environment:
      NODE_ENV: development
      PORT: 8090
      APP_BASE_URL: http://localhost:8090
      DB_CONNECTION_STRING: postgresql://postgres:sprint1_local_password@db:5432/ban_ve_su_kien_sprint1
      DEMO_ADMIN_EMAIL: admin@demo.local
      DEMO_ADMIN_PASSWORD: AdminDemo123!
      DEMO_ORGANIZER_EMAIL: organizer@demo.local
      DEMO_ORGANIZER_PASSWORD: OrganizerDemo123!
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate:latest && npm run seed:run && npm start"]
    restart: unless-stopped

volumes:
  sprint1_postgres_data:
