<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Đăng nhập</title><link rel="stylesheet" href="/styles.css"></head><body><main class="page"><section class="card" style="max-width:520px;margin:auto"><h1>Đăng nhập</h1><p class="muted">Đăng nhập để quản lý sự kiện hoặc chọn ghế.</p><form id="form"><label>Email</label><input name="email" type="email" required><label>Mật khẩu</label><input name="password" type="password" minlength="8" required><div id="msg"></div><button>Đăng nhập</button></form></section></main><script>form.onsubmit=async(e)=>{e.preventDefault();const b=e.submitter;b.disabled=true;const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();msg.className='message '+(r.ok?'':'error');msg.textContent=d.message||'Đăng nhập thành công.';if(r.ok)location='/organizer-events.html';b.disabled=false}</script></body></html>
