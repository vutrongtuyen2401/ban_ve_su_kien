<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Đăng ký</title><link rel="stylesheet" href="/styles.css"></head><body><main class="page"><section class="card" style="max-width:560px;margin:auto"><h1>Đăng ký</h1><p class="muted">Tạo tài khoản người mua để đặt vé sự kiện.</p><form id="registerForm"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Mật khẩu</label><input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><small class="muted">Từ 8 đến 128 ký tự.</small><label for="confirmation">Nhập lại mật khẩu</label><input id="confirmation" name="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><div id="message" aria-live="polite"></div><button type="submit">Đăng ký</button></form><p class="auth-links">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p></section></main><script src="/register.js"></script></body></html>
