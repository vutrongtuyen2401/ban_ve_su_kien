<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand-block">
          <div class="brand-icon">A</div>
          <h1>Đăng ký</h1>
        </div>

        <form id="registerForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="fullName">Họ tên</label>
            <input id="fullName" name="fullName" type="text" placeholder="Nhập họ tên của bạn" />
          </div>

          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="example@email.com" />
          </div>

          <div class="field-group">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" placeholder="Nhập mật khẩu tối thiểu 8 ký tự" />
          </div>

          <div id="errorBox" class="message error" hidden></div>
          <div id="successBox" class="message success" hidden></div>

          <button id="submitButton" type="submit" class="primary-btn">Đăng ký</button>
        </form>

        <p class="footer-text">
          Đã có tài khoản?
          <a href="#">Đăng nhập</a>
        </p>
      </div>
    </div>

    <script>
      const form = document.getElementById('registerForm');
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      const submitButton = document.getElementById('submitButton');

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
        successBox.hidden = true;
      }

      function showSuccess(message) {
        successBox.textContent = message;
        successBox.hidden = false;
        errorBox.hidden = true;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const payload = {
          fullName: document.getElementById('fullName').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        };

        submitButton.disabled = true;
        submitButton.textContent = 'Đang xử lý...';

        try {
          const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || 'Đăng ký thất bại.');
          }

          showSuccess(result.message || 'Đăng ký thành công.');
          form.reset();
        } catch (error) {
          showError(error.message || 'Có lỗi xảy ra.');
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Đăng ký';
        }
      });
    </script>
  </body>
</html>
